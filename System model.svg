<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4A5568" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3182CE" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#805AD5" />
    </marker>
    
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF8FF" />
      <stop offset="100%" stop-color="#BEE3F8" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFAF0" />
      <stop offset="100%" stop-color="#FEEBC8" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF" />
      <stop offset="100%" stop-color="#E9D8FD" />
    </linearGradient>
  </defs>

  <rect width="900" height="800" fill="#F7FAFC" rx="10" />

  <text x="450" y="35" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1A202C">6G MARL-RAN System Model Architecture</text>

  <g transform="translate(30, 60)">
    <rect width="840" height="170" fill="url(#blueGrad)" stroke="#63B3ED" stroke-width="2" rx="8" />
    <text x="20" y="25" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">1. PHYSICAL RAN INFRASTRUCTURE LAYER</text>
    
    <rect x="60" y="45" width="180" height="70" fill="#FFFFFF" stroke="#3182CE" stroke-width="2" rx="6" />
    <text x="150" y="75" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#2D3748">gNodeB Cell 0</text>
    <text x="150" y="95" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#718096">(Local Actor Policy 0)</text>

    <rect x="330" y="45" width="180" height="70" fill="#FFFFFF" stroke="#3182CE" stroke-width="2" rx="6" />
    <text x="420" y="75" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#2D3748">gNodeB Cell 1</text>
    <text x="420" y="95" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#718096">(Local Actor Policy 1)</text>

    <rect x="600" y="45" width="180" height="70" fill="#FFFFFF" stroke="#3182CE" stroke-width="2" rx="6" />
    <text x="690" y="75" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#2D3748">gNodeB Cell 2</text>
    <text x="690" y="95" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#718096">(Local Actor Policy 2)</text>

    <rect x="60" y="135" width="720" height="22" fill="#FED7D7" stroke="#E53E3E" stroke-dasharray="4" rx="4" />
    <text x="420" y="151" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#9B2C2C">DYNAMIC INTER-CELL INTERFERENCE &amp; FREQUENCY PRB CONFLICT ZONE</text>

    <path d="M 150 115 L 150 135" stroke="#E53E3E" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M 420 115 L 420 135" stroke="#E53E3E" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M 690 115 L 690 135" stroke="#E53E3E" stroke-width="1.5" marker-end="url(#arrow)" />
  </g>

  <path d="M 450 230 L 450 260" stroke="#4A5568" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)" />
  <text x="460" y="250" font-family="Segoe UI, sans-serif" font-size="12" fill="#4A5568" font-style="italic">OAI Telemetry Ingestion</text>

  <g transform="translate(30, 260)">
    <rect width="840" height="150" fill="url(#orangeGrad)" stroke="#DD6B20" stroke-width="2" rx="8" />
